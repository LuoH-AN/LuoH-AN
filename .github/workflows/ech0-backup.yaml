name: Ech0 Backup Automation

on:
  schedule:
    # 每15分钟运行一次 (UTC时间)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许手动触发

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://ech0.enltlh.me/api' }}
  ECH0_TOKEN: ${{ secrets.ECH0_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TARGET_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run backup script
        run: python python/ech0-backup.py
